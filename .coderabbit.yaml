# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

reviews:
  # Fast, balanced reviews focused on actionable bugs, security, and major issues.
  profile: "chill"

  # Avoid blocking PRs with formal request-changes delays.
  request_changes_workflow: false

  # Concise PR summary and review status.
  high_level_summary: true
  review_status: true

  # Disable decorative output.
  poem: false
  in_progress_fortune: false

  auto_review:
    # Automatically review new and updated PRs.
    enabled: true

    # Review new commits incrementally.
    auto_incremental_review: true

    # Prevent excessive reviews on very large/active PRs.
    auto_pause_after_reviewed_commits: 10

    # Do not review draft PRs.
    drafts: false

    # Skip these PR titles.
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
      - "DO NOT REVIEW"

    # Ignore automated dependency PRs.
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

    # Optional label to skip CodeRabbit.
    labels:
      - "!do-not-review"

  # Exclude generated code, dependencies, and binary assets from review.
  path_filters:
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/*.mocks.dart"
    - "!**/Pods/**"
    - "!**/.gradle/**"
    - "!**/DerivedData/**"
    - "!**/*.lock"
    - "!**/generated_plugin_registrant.dart"
    - "!**/assets/**"

  path_instructions:
    # ============================================================
    # FLUTTER / DART APPLICATION CODE
    # ============================================================
    - path: "lib/**/*.dart"
      instructions: |
        Review Flutter/Dart code focusing on high-impact production issues:

        - Resource Leaks: Ensure AnimationController, TextEditingController,
          ScrollController, FocusNode, StreamSubscription, and Timer instances are disposed or cancelled.
        - Async & Lifecycle: Check for BuildContext used across async gaps without
          a mounted check. Ensure unhandled Futures and network errors are caught.
        - Performance: Flag heavy computations, JSON parsing, or allocations
          inside build() methods. Check for unbounded list rendering without builders.
        - Security: Flag hardcoded API keys, tokens, credentials, or sensitive data
          leaking into logs or insecure local storage.
        - State & Logic: Avoid business logic leaking into UI widgets. Keep state predictable.
        - Noise reduction: Do not comment on formatting, styling, or items already
          covered by the Dart analyzer/linter. Prioritize actionable defects.

    # ============================================================
    # TESTS
    # ============================================================
    - path: "test/**/*.dart"
      instructions: |
        Review tests for reliability:
        - Detect flaky tests, timing dependencies, or missing async synchronization.
        - Ensure mock resources and streams are cleaned up.

    # ============================================================
    # NATIVE PLATFORMS (ANDROID / iOS)
    # ============================================================
    - path: "{android,ios}/**"
      instructions: |
        Review native platform changes for:
        - Exposed secrets, credentials, or insecure permissions.
        - Deep link and exported component vulnerabilities.
        - Breaking build/plugin configuration changes.

    # ============================================================
    # CI/CD & DEPENDENCIES
    # ============================================================
    - path: "{pubspec.yaml,.github/**}"
      instructions: |
        - Flag deprecated, unmaintained, or risky dependencies.
        - Flag unpinned third-party GitHub Actions or exposed CI secrets.

chat:
  # Respond when @coderabbitai is mentioned in PR comments.
  auto_reply: true
