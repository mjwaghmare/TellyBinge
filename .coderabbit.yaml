# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    auto_incremental_review: false # was true — was re-reviewing on every push
    auto_pause_after_reviewed_commits: 10
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
      - "DO NOT REVIEW"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
    labels:
      - "!do-not-review"

  path_filters:
    - "!**/build/**"
    - "!**/.dart_tool/**"
    - "!**/*.g.dart"
    - "!**/*.freezed.dart"
    - "!**/*.mocks.dart"
    - "!**/Pods/**"
    - "!**/.gradle/**"
    - "!**/DerivedData/**"
    - "!**/*.lock"
    - "!**/generated_plugin_registrant.dart"
    - "!**/assets/**"

  path_instructions:
    - path: "lib/**/*.dart"
      instructions: |
        Flag: undisposed controllers/listeners (Animation, TextEditing, Scroll, FocusNode,
        StreamSubscription, Timer); BuildContext used after async gap without mounted check;
        unhandled Futures; heavy work/JSON parsing in build(); hardcoded secrets or sensitive
        data in logs/local storage; business logic in UI widgets. Skip formatting/lint-covered issues.

    - path: "test/**/*.dart"
      instructions: |
        Flag flaky/timing-dependent tests, missing async sync, uncleaned mocks/streams.

    - path: "{android,ios}/**"
      instructions: |
        Flag exposed secrets, insecure permissions, exported component/deep-link vulns,
        breaking build/plugin config changes.

    - path: "{pubspec.yaml,.github/**}"
      instructions: |
        Flag deprecated/unmaintained/risky deps, unpinned GitHub Actions, exposed CI secrets.

chat:
  auto_reply: true
